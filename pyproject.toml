[project]
name = "pycodedj"
version = "0.5.1"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "python-osc>=1.8",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
watch = ["watchdog>=3.0"]

[project.scripts]
pycodedj = "pycodedj.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycodedj"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
